# NRL客户端配置文件
# 服务器列表配置
servers:
  - name: "安徽NRL服务器"
    host: "43.143.14.24"
    port: 60050
  - name: "江苏NRL服务器"
    host: "43.143.14.25"
    port: 60050
  - name: "浙江NRL服务器"
    host: "192.168.1.100"
    port: 60050
  - name: "本地测试服务器"
    host: "127.0.0.1"
    port: 60050

# 当前使用的服务器（默认使用第一个）
current_server: 0

# 服务器配置（向后兼容，将被servers列表替代）
server:
  host: "43.143.14.24"  # 服务器地址
  port: 60050        # 服务器UDP端口

device:
  callsign: "BH6ERO"  # 设备呼号
  ssid: 1          # 设备SSID
  cpuid: "12345678"  # 设备CPUID
  password: "" # 设备密码
  model: 1           # 设备型号

audio:
  sample_rate: 8000  # 采样率
  channels: 1         # 声道数
  chunk_size: 500    # 音频块大小（62.5ms，8000Hz采样率，16位采样，对应500字节G.711包）
  format: "paInt16" # 音频格式

network:
  buffer_size: 4096  # 网络缓冲区大小
  heartbeat_interval: 2  # 心跳间隔（秒）